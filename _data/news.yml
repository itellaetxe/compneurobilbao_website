- date: "January 23rd, 2026"
  headline: "Congratulations to Dr. Jorge Garcia Condado!"
  description: "We are happy to share that [Jorge Garcia Condado](https://scholar.google.com/citations?user=533sDjUAAAAJ&hl=en) has earned his PhD after defending his doctoral dissertation at the University of the Basque Country (UPV/EHU). We are extremely proud of his accomplishment and wish him every success as he embarks on the next chapter of his professional journey. We are sure great opportunities await him ahead!"
  image: 'jorge_tesis.jpg'

- date: "January 16th, 2026"
  headline: "Congratulations to Dr. Izaro Fernandez Iriondo!"
  description: "Our colleague [Izaro Fernandez Iriondo](https://scholar.google.com/citations?user=kTsYoXAAAAAJ&hl=es) has successfully completed and defended his PhD dissertation at the University of the Basque Country (UPV/EHU). We are very proud of this important milestone and are excited to see what lies ahead for her as she begins his journey as a postdoctoral researcher in the CompNeuro Lab!"
  image: 'izaro_tesis.jpeg'

- date: "January 15th, 2026"
  headline: "Special Guest Talk – Dr. Ana Luísa Pinho"
  description: "We were happy to welcome Dr. [Ana Luísa Pinho](https://scholar.google.com/citations?user=wb9Io7gAAAAJ&hl=en) from the Western University, Canada, who offered a lecture at IIS Biobizkaia entitled Deep-Behavioral Phenotyping in Systems Neuroscience for Functional Atlasing and Cognitive Mapping of the Human Brain."
  image: 'ana_luisa_talk.jpeg'

- date: "October 10th, 2025"
  headline: "Congratulations to Dr. Borja Camino Pontes!"
  description: "Our colleague Borja Camino Pontes has successfully defended his PhD thesis at the University of the Basque Country (UPV/EHU). We are extremely proud of his achievement and look forward to his next steps as a postdoctoral researcher in the CompNeuro Lab!"
  image: 'borja_tesis.jpeg'

- date: "October 3rd, 2025"
  headline: "Special Guest Talk – Dr. Pamela Guevara (University of Concepción, Chile)"
  description: "We were delighted to host Dr. [Pamela Guevara](https://scholar.google.com/citations?user=Bf2VTFYAAAAJ&hl=es) from the University of Concepción, Chile, who gave a special lecture at IIS Biobizkaia titled Estudio de conectividad cerebral mediante RM por difusión: principios, métodos y ejemplos de aplicación."
  image: 'pamela_talk.jpeg'

- date: "March 12th, 2025"
  headline: "Our Computational Neuroimaging Group at the 10th Innovation Day"
  description: "Our computational neuroimaging group was excited to participate in the 10th Innovation Day, presenting our latest advances in brain imaging technology and engaging directly with medical professionals to discuss future research directions."
  image: 'innovation.PNG'

- date: "February 17th, 2025"
  headline: "Special Scientific Seminar: Prof. Sonja Kotz!"
  description: "It was a pleasure hosting Prof. [Sonja Kotz](https://scholar.google.de/citations?user=2wVCGFUAAAAJ&hl=de) from Maastricht University  who provided enlightening insights into how time and rhythm influence cognition, perception, and action during our hybrid seminar."
  image: 'sonja.jpg'

- date: "February 10th, 2025"
  headline: " Special Guest Speaker: Prof. Timothée Levi"
  description: "This week, we welcomed Prof. [Timothée Levi](https://scholar.google.fr/citations?user=NY2bRRMAAAAJ&hl=fr) from Bordeaux, who presented his neuromorphic FPGA simulating hundreds of neurons in real time using optical sensors. His work prompted an insightful discussion on new directions in neuronal research."
  image: 'tim.jpg'

- date: 'November 18-21, 2024'
  headline: 'BrainModes 2024: What a Great Time!'
  description: "BrainModes 2024 was an amazing experience! We had so much fun with incredible and smart people in such a friendly 
  and collaborative atmosphere. We shared ideas, great conversations, and lots of laughs, both during the conference and after. 
  The food was great, the vibe was awesome, and we couldn't have asked for more. Big thanks to everyone who came and made it 
  so special. Check out the [video](https://youtu.be/8LDsw5ly6AQ?si=UF_8CWO02Y3LyCLX) in the [CompNeuroBilbao Lab Youtube Channel](https://www.youtube.com/@CompNeuroBilbaoLab) to see some of the best moments. 
  Hope you enjoy it as much as we did!"
  image: 'BRAINMODES_GRUPO.png'


- date: 'November 14th, 2024'
  headline: 'BrainModes 2024'
  description: "We are excited to announce that our lab will be hosting the BrainModes 2024 Bilbao conference! You can find more information about the program in the
  [official website](https://brainmodes-bilbao-2024.eu/). We will also be streaming the speaker talks in the 
  [CompNeuroBilbao Lab YouTube Channel](https://www.youtube.com/@CompNeuroBilbaoLab). We look forward to welcoming you to Bilbao for this exciting event!"
  image: 'brain_modes_2024.jpg'

- date: 'November 12th, 2024'
  headline: 'Talks on Computational Neuroimaging at UPV/EHU!'
  description: "Our group was invited to the School of Engineering at San Mames in Bilbao to give talks on Computational Neuroimaging. 
  It was a fantastic opportunity to share our work, explain key concepts, and discuss real-world applications with students and experts. The experience was both rewarding and inspiring for everyone involved."
  image: 'ehu_talks.jpeg'

- date: 'October 21st, 2024'
  headline: 'Former Lab Member Marylin Gatica visits us!'
  description: "Today, we had a great talk with [Marylin Gatica](https://scholar.google.com/citations?user=QFTWPOgAAAAJ&hl=en) Postdoctoral Research 
  Assistant in the Network Science Institute at Northeastern University London. 
  Marylin shared her insights on Higher-order functional interactions in clinical applications. A fascinating dive into the future of neuroscience!"
  image: 'marylin.JPG'

- date: 'June 3rd, 2024'
  headline: 'Gorka Zamora visits the lab!'
  description: "Today, we had a great talk with [Gorka Zamora Lopez](https://www.zamora-lopez.xyz/)  from Pompeu Fabra University in Barcelona. 
  Gorka shared insights from his research, diving into everything from his earlier studies to the latest 
  work on a cool new method they've developed for studying complex networks based on the propagation of 
  stimulus/response activity."
  image: 'gorka_zamora.jpeg'

- date: 'May 27th, 2024'
  headline: "Kicking Off the Lab's Journal Club with a Bang!"
  description: 'Today our PI, Jesus Cortes, inaugurated our Journal Club by presenting the intriguing paper ["TMS-evoked responses are driven by recurrent large-scale 
  network dynamics"](https://www.ncbi.nlm.nih.gov/pmc/articles/PMC10121222/) from eLife Sciences. The presentation sparked a lively and insightful discussion among the team. 
  Everyone enjoyed engaging with the topic and sharing diverse perspectives!'
  image: 'journalclub_1.jpg'

- date: 'May 6th, 2024'
  headline: 'Lorena Chacana new lab visitor gives a talk!'
  description: 'Today, we had the pleasure of having with us [Lorena Chacana](https://www.researchgate.net/profile/Lorena-Chacana-Veliz) from 
  Chile and learning about her work. She talked about the impaired mPFC - HPC oscillatory coupling in aged mice during spatial learning and we learned a lot about.
  Welcome to the lab and we hope you enejoy these two weeks in Bilbao!'
  image: 'lorena.jpeg'

- date: 'April 29th, 2024'
  headline: 'Grace Whitaker visits the lab!'
  description: 'Today, we had the pleasure of meeting [Grace Whitaker](https://scholar.google.de/citations?user=NKqxpJUAAAAJ&hl=es&oi=sra) and learning about her work. 
  She talked about some of her Cognitive Neuroscience Projects, including topics such as dopamine and attentional 
  inhibition, harnessing neuronal entrainment, and the intersection of affective touch and technology. THM: 
  hugging is not only nice, it is a biological necessity :)'
  image: 'grace.JPG'